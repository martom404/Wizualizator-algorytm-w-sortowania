<div>
  <h3>Algorytm: {{ info().name }}</h3>

  <p><strong>Opis:</strong> {{ info().summary }}</p>

  <p><strong>Przedział wartości:</strong> 1 - {{ info().maxValue }}</p>
  <p-table [value]="rows()" showGridlines>
    <ng-template #header>
      <tr>
        <th>Najgorszy przypadek</th>
        <th>Średni przypadek</th>
        <th>Najlepszy przypadek</th>
      </tr>
    </ng-template>
    <ng-template #body let-info>
      <tr>
        <td><p-tag [value]="info.worst" severity="danger"/></td>
        <td><p-tag [value]="info.average" severity="warn"/></td>
        <td><p-tag [value]="info.best" severity="success"/></td>
      </tr>
    </ng-template>
  </p-table>

  <p class="note">{{ info().note }}</p>
</div>
